name: Build Gauge Firmware

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'partitions.csv'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gauge-firmware-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ESP32-S3 firmware
        run: pio run -e esp32s3_amoled

      - name: Prepare phone OTA firmware
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/esp32s3_amoled/firmware.bin dist/ElantraN_Gauge_OTA.bin
          sha256sum dist/ElantraN_Gauge_OTA.bin > dist/ElantraN_Gauge_OTA.bin.sha256

      - name: Save build as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElantraN-Gauge-Firmware
          path: |
            dist/ElantraN_Gauge_OTA.bin
            dist/ElantraN_Gauge_OTA.bin.sha256
          if-no-files-found: error

      - name: Replace rolling Latest Firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release create latest \
            dist/ElantraN_Gauge_OTA.bin \
            dist/ElantraN_Gauge_OTA.bin.sha256 \
            --target "$GITHUB_SHA" \
            --title "Latest Gauge Firmware" \
            --notes "Automatically built from main. Download ElantraN_Gauge_OTA.bin on your phone and upload it through the gauge OTA page."
