; ============================================================================
; Elantra N Gauge - PlatformIO configuration
;
; Reconstructed from the build output captured earlier in this project:
;   platform : pioarduino/platform-espressif32 @ 54.03.21
;   board    : esp32-s3-devkitc-1
;   framework: arduino  (framework-arduinoespressif32 @ 3.2.1)
;   RAM  used 83,924 / 327,680 bytes
;   Flash used 1,238,902 / 6,553,600 bytes  <- 0x640000 app partition
;   libs : NimBLE-Arduino 1.4.3, GFX Library for Arduino 1.6.4,
;          lvgl 8.4.0, Wire 3.2.1
;
; OTA requires two app slots. This project now carries an explicit 16 MB
; partition table with two 0x640000 (6,553,600-byte) OTA slots so phone
; updates do not depend on a framework-default partition file.
; ============================================================================

[env:esp32s3_amoled]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-s3-devkitc-1
framework = arduino

; --- Board hardware: ESP32-S3R8 = 16 MB flash + 8 MB OCTAL PSRAM ---
; The generic devkitc-1 board definition assumes no PSRAM, so it must be
; declared explicitly. qio_opi = quad flash + octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL looks for lv_conf.h next to the library unless told otherwise.
    ; With this flag it does #include "lv_conf.h", resolved from include/.
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; NimBLE: client role only, saves a lot of flash
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

lib_deps =
    h2zero/NimBLE-Arduino @ 1.4.3
    moononournation/GFX Library for Arduino @ 1.6.4
    lvgl/lvgl @ 8.4.0

lib_ldf_mode = chain
